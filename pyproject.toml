[project]
name = "carthagent"
version = "0.13.1"
description = "Evidence-first fixed-asset schedule extraction"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1.5,<4",
  "pymupdf>=1.26.5,<2",
  "pillow>=11.3,<13",
]

[project.scripts]
carthagent = "carthagent.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.0,<7",
    "pytest>=8.4,<10",
    "reportlab>=4.4,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carthagent"]


